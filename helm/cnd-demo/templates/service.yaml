{{- if .Values.serverMock.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serverMock.name }}
  labels:
    {{- include "cnd-demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.serverMock.service.type }}
  ports:
    - port: {{ .Values.serverMock.service.port }}
      targetPort: {{ .Values.serverMock.service.port }}
      protocol: TCP
      name: http2-rest
  selector:
    {{- include "cnd-demo.selectorLabels" . | nindent 4 }}
{{- end }}
