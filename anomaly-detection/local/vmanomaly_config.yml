settings:
  n_workers: 1
  restore_state: true

schedulers:
  online:
    class: "periodic"
    infer_every: "1m"
    fit_every: "300d"
    fit_window: "14d"

  backfill_online:
    class: "backtesting"
    from_iso: "%{VMANOMALY_BACKFILL_FROM}"
    to_iso: "%{VMANOMALY_BACKFILL_TO}"
    fit_every: "100d"
    fit_window: "14d"
    inference_only: true
    infer_every: "1h"
    exact: true
    n_jobs: 1

models:
  # Fast online baseline for abrupt payment error spikes.
  mad_errors:
    class: "mad_online"
    detection_direction: "above_expected"
    anomaly_score_outside_data_range: 3
    decay: 0.98
    threshold: 4
    clip_predictions: true
    provide_series: ["y", "anomaly_score", "yhat", "yhat_lower", "yhat_upper"]
    schedulers: [online, backfill_online]
    queries: [payment_error_ratio]

  # A causal envelope for smooth intraday and weekday/weekend latency patterns.
  temporal_envelope_latency:
    class: "temporal_envelope"
    detection_direction: "above_expected"
    anomaly_score_outside_data_range: 3
    quantiles: [0.25, 0.75]
    iqr_threshold: 2
    alpha: 0.005
    loss_reactivity: 2
    # One hour at the reader's one-minute sampling cadence.
    changepoint_window: 60
    seasonalities: ["hod_smooth", "dow_smooth"]
    clip_predictions: true
    provide_series: ["y", "anomaly_score", "yhat", "yhat_lower", "yhat_upper"]
    schedulers: [online, backfill_online]
    queries: [checkout_latency_p95]

  # Traffic uses the same online model with a lower-tail business objective.
  temporal_envelope_traffic:
    class: "temporal_envelope"
    detection_direction: "below_expected"
    anomaly_score_outside_data_range: 3
    forecast_at: ["1h", "6h"]
    quantiles: [0.25, 0.75]
    iqr_threshold: 2
    alpha: 0.005
    loss_reactivity: 2
    # One hour at the reader's one-minute sampling cadence.
    changepoint_window: 60
    seasonalities: ["hod_smooth", "dow_smooth"]
    clip_predictions: true
    provide_series: ["y", "anomaly_score", "yhat", "yhat_lower", "yhat_upper"]
    schedulers: [online, backfill_online]
    queries: [checkout_request_rate]

reader:
  datasource_url: "http://victoriametrics:8428/"
  sampling_period: "60s"
  max_points_per_query: 15000
  queries:
    checkout_latency_p95:
      expr: |
        max(apm_http_server_request_duration_seconds_p95{
          service_namespace="shop",
          service_name="checkout-api",
          http_route="/checkout"
        }) without (service_version)
      data_range: [0, "inf"]

    checkout_request_rate:
      expr: |
        sum(rate(apm_http_server_request_count_total{
          service_namespace="shop",
          service_name="checkout-api",
          http_route="/checkout"
        }[2m])) without (service_version)
      data_range: [0, "inf"]

    payment_error_ratio:
      expr: |
        max(apm_rpc_client_error_ratio{
          service_namespace="shop",
          service_name="checkout-api",
          peer_service="payment-service"
        }) without (service_version)
      data_range: [0, 1]

writer:
  # Write through vmagent so large backtesting output bursts can be buffered
  # and rate-limited before reaching VictoriaMetrics.
  datasource_url: "http://vmagent:8429/"
  metric_format:
    __name__: "otel_apm_$VAR"
    for: "$QUERY_KEY"

server:
  # already does what monitoring.pull does, exposing a /metrics endpoint with self-monitoring data
  addr: "0.0.0.0"
  port: 8490
  ui_default_state: "#/?datasourceUrl=http://victoriametrics:8428&autocomplete=true&g0.step_input=15m&g0.range_input=30d&g0.relative_time=last_30_days&show_business_boundaries=true"
  # if set to true, UI will use connection settings from reader configuration below when connecting to data sources, 
  #allowing it to connect with the same credentials, TLS settings, etc. without requiring having vmauth in front of both UI and data sources.
  use_reader_connection_settings: true
