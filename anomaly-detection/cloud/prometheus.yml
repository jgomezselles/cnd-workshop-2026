global:
  scrape_interval: 10s
  # vmagent expands %{...} from container environment variables.
  # These labels route scraped self-monitoring metrics to the participant
  # write tenant when vmagent forwards to the Cloud multitenant endpoint.
  external_labels:
    vm_account_id: "%{VM_CLOUD_WRITE_ACCOUNT_ID}"
    vm_project_id: "%{VM_CLOUD_WRITE_PROJECT_ID}"

scrape_configs:
  # Local self-monitoring metrics for the cloud-backed demo services.
  - job_name: "vmagent"
    static_configs:
      - targets: ["vmagent:8429"]

  - job_name: "vmanomaly"
    static_configs:
      - targets: ["vmanomaly:8490"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "vmalert"
    static_configs:
      - targets: ["vmalert:8880"]
