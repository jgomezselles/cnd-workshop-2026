route:
  receiver: local-webhook
  group_by: ["alertname", "severity", "service_namespace", "service_name", "business_flow", "for"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 2m

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://alert-webhook:5001/alerts
        send_resolved: true
