opentelemetry-collector:
  enabled: true
  fullnameOverride: "otelcol"
  mode: deployment
  image:
    repository: "otel/opentelemetry-collector-contrib"
  presets:
    clusterMetrics:
      enabled: true
    kubernetesAttributes:
      enabled: true

  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      zpages:
        endpoint: 0.0.0.0:55679

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318

    exporters:
      debug:
        verbosity: normal
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      extensions: [health_check, zpages]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: []
          exporters: [debug]


serverMock:
  enabled: false

hermes:
  enabled: false

victoria-metrics-single:
  enabled: false

victoria-logs-single:
  enabled: false

victoria-traces-single:
  enabled: false

jaeger:
  enabled: false

grafana:
  enabled: false
